<!doctype html><html><meta charset="utf-8"><title data-i18n="optionsTitle">pawz · Extension</title>
<style>body{font:16px system-ui;background:#101722;color:#fff;max-width:650px;margin:70px auto}input{padding:12px;width:90%;background:#25354b;color:#fff;border:1px solid #58708c;border-radius:8px}button{margin-top:20px;padding:12px 20px;background:#2765cc;color:white;border:0;border-radius:8px}</style>
<h1 data-i18n="optionsHeading">pawz · Browser connection</h1>
<p><span data-i18n="tokenHelpBefore">Copy the</span> <code>browser_token</code> <span data-i18n="tokenHelpAfter">value from</span> <code>%APPDATA%\pawz\settings.json</code>.</p>
<input id="token" type="password" data-i18n-placeholder="tokenPlaceholder" placeholder="Local connection token">
<p><span data-i18n="portHelpBefore">Port (the</span> <code>port</code> <span data-i18n="portHelpAfter">value in the same file, 8765 by default)</span></p>
<input id="port" type="number" min="1024" max="65535" placeholder="8765">
<p><button id="save" data-i18n="save">Save</button></p><p id="status"></p>
<script src="options.js"></script></html>
